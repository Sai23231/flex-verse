name: Build and Deploy React App to CloudFront
on:
  push:
    branches: [master]
jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      BUCKET: www.flex-verse.com
      DIST: build
      REGION: us-east-1
      DIST_ID_1: E3EGIBRWDX3OCU
      DIST_ID_2: E3DB2EVO8KDJBI

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'yarn'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Install Dependencies
        run: |
          node --version
          yarn install
      - name: Build Static Website
        run: yarn build
        env:
          CI: false
          REACT_APP_BACKEND_URL: ${{ secrets.PRODUCTION_API_URL }}
          REACT_APP_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          REACT_APP_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Copy files to the production website with the AWS CLI
        run: |
          aws s3 sync --delete ${{ env.DIST }} s3://${{ env.BUCKET }}

      - name: Create Invalidate
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.DIST_ID_1 }} \
            --paths "/*"
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.DIST_ID_2 }} \
            --paths "/*"
